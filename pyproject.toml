[project]
name = "residency-agentcore-chatbot"
version = "0.1.0"
description = "Data-residency-compliant NL chatbot on Amazon Bedrock AgentCore (ap-south-1)"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "strands-agents",
    "mcp",
    "httpx",
    "psycopg[binary]",
    "hypothesis",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "websockets>=16.0",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", ".hypothesis", ".pytest_cache"]
# Every finding below was reviewed individually; each rule is suppressed for a
# documented reason that holds across the whole codebase:
#   B404/B603/B607 — deploy.py and infra/*.py run child processes ONLY as
#     fixed, fully literal argv lists (["uv", "run", "python", "<in-repo
#     script>"] and the container-tool wrapper); shell=True is never used and
#     no user-controlled input ever reaches a command line. "Partial path"
#     resolution of `uv`/`bash` via PATH is intentional so the same code runs
#     on a laptop (finch) and in CodeBuild (docker).
#   B311 — tools/make_sample_data.py uses a SEEDED random.Random to generate
#     reproducible synthetic sample data; nothing security-relevant is derived
#     from it.
skips = ["B404", "B603", "B607", "B311"]
